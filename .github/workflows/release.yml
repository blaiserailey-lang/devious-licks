# Builds the Mac app and publishes the DMG to GitHub Releases.
# To ship a new version: bump "version" in package.json, then either push a tag
# (git tag v0.2.0 && git push origin v0.2.0) or create a release named v0.2.0 on
# GitHub's Releases page. The DMG gets attached to that release.
# Friends always download the newest build from:
#   https://github.com/<owner>/<repo>/releases/latest
name: Release Mac app

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      # Native player + N64 core (cached; rebuilt only when the player changes).
      - uses: actions/cache@v4
        with:
          path: player/.build
          key: player-build-${{ hashFiles('player/build-mac.sh') }}
      - name: Build native N64 player
        run: player/build-mac.sh

      # Point the app at this repo's catalog, whatever the repo is called.
      - name: Set catalog repo
        run: |
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json"));
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split("/");
            Object.assign(p.deviousLicks.catalog, { owner, repo, branch: process.env.DEFAULT_BRANCH });
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2));
          '
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      # Signed + notarized when the Apple secrets exist; otherwise an ad-hoc
      # signed build that friends open via System Settings > Privacy & Security.
      - name: Build DMG
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            npx electron-builder --mac dmg --publish never
          else
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            npx electron-builder --mac dmg --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: dist/*.dmg

      # Tag push / published release: attach to that tag. Manual "Run workflow":
      # create (or update) the release v<version from package.json>.
      - name: Pick release tag
        id: tag
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then echo "name=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else echo "name=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"; fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: dist/*.dmg
          generate_release_notes: true
